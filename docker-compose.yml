services:
  postgres:
    image: postgres:16
    container_name: music-app-postgres
    environment:
      POSTGRES_DB: music_app
      POSTGRES_USER: music_app
      POSTGRES_PASSWORD: music_app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_app -d music_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
